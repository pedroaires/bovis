services:
  postgres:
    image: postgres:15-alpine
    container_name: bovis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bovisdb
      POSTGRES_USER: bovisuser
      POSTGRES_PASSWORD: bovis1111
    ports:
      - "5432:5432"
    volumes:
      - bovis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bovisuser -d bovisdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: maven:3.9.9-eclipse-temurin-11
    container_name: bovis-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - bovis_maven_cache:/root/.m2
    command: mvn spring-boot:run
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bovisdb
      SPRING_DATASOURCE_USERNAME: bovisuser
      SPRING_DATASOURCE_PASSWORD: bovis1111
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/boi/listBois || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:18-alpine
    container_name: bovis-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - bovis_node_modules:/app/node_modules
    command: sh -c "npm install && npm run serve -- --host 0.0.0.0 --port 3000"
    environment:
      VUE_APP_API_URL: http://localhost:8080/api
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  bovis_postgres_data:
  bovis_maven_cache:
  bovis_node_modules:
