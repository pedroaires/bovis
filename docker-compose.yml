version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: bovis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bovisdb
      POSTGRES_USER: bovisuser
      POSTGRES_PASSWORD: bovis1111
    ports:
      - "5432:5432"
    volumes:
      - bovis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bovisuser -d bovisdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bovis_postgres_data:
